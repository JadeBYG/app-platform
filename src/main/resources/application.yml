spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  employer:
    inviteCode: ${APP_EMPLOYER_INVITE_CODE:change-me}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes!!}
      ttlSeconds: ${APP_SECURITY_JWT_TTLSECONDS:86400}
